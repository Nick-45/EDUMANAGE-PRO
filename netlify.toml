[build]
  command = "CI='' npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  REACT_APP_API_URL = "/.netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "bcryptjs", "jsonwebtoken"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
