[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "build"

[build.environment]
  REACT_APP_API_URL = "/.netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "bcryptjs", "jsonwebtoken"]

# SPA fallback — MUST come after any /api redirects.
# Since REACT_APP_API_URL points directly at /.netlify/functions,
# we don't need an /api/* rewrite at all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
